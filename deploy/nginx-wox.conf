# Rate limiting zone for Wox API (optional security layer)
limit_req_zone $binary_remote_addr zone=wox_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name wox.yourdomain.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wox.yourdomain.com;

    # SSL Certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/wox.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wox.yourdomain.com/privkey.pem;

    # SSL hardening protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max upload size for WhatsApp media (images, voice notes, PDFs, videos)
    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to Wox WhatsApp Gateway (Port 8080)
    location / {
        limit_req zone=wox_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (Required for Baileys QR streaming & Real-time events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy webhook delivery and media processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
