openapi: 3.1.0
info:
  title: Wox WhatsApp Gateway API
  version: 2.3.7
  description: |
    # ⚡ Wox WhatsApp Enterprise API by Ox Tech
    
    Enterprise-grade, multi-tenant WhatsApp Gateway & Automation Platform.
    
    ## 🔐 Authentication
    All protected endpoints require an **`apikey`** header or Bearer JWT token in the `Authorization` header.
    
    ```http
    apikey: YOUR_GLOBAL_OR_INSTANCE_KEY
    ```
    or
    ```http
    Authorization: Bearer YOUR_JWT_TOKEN
    ```
    
    ## 🚀 Core Features
    - **Instance Management**: Create, connect, QR code pairing, multi-session state.
    - **High-Speed Messaging**: Text, media, templates, buttons, polls, locations.
    - **Integrations**: WooCommerce, Salla, Zid, ChatGPT, Typebot, Dify, Chatwoot, N8N.
    - **Resilience**: Webhooks V2 with cryptographic signatures & retry, Redis rate limiter, RBAC.
    
  contact:
    name: Ox Tech Enterprise Support
    email: support@oxtech.com
    url: https://oxtech.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Current Server Endpoint
  - url: https://api.woxwhatsapp.com
    description: Cloud Production Cluster

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Instance Token or Global API Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User / Admin JWT Access Token

  schemas:
    GenericResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: "Operation completed successfully"

    SendTextMessageDto:
      type: object
      required:
        - number
        - text
      properties:
        number:
          type: string
          description: Recipient WhatsApp number with country code (e.g. 966501234567)
          example: "966501234567"
        text:
          type: string
          description: Plain or markdown formatted message content
          example: "مرحباً بك! تم تأكيد طلبك بنجاح ✅"
        delay:
          type: integer
          description: Delay in milliseconds before dispatch
          example: 1200
        linkPreview:
          type: boolean
          description: Generate rich preview for links in message
          example: true

    SendMediaMessageDto:
      type: object
      required:
        - number
        - mediatype
        - media
      properties:
        number:
          type: string
          example: "966501234567"
        mediatype:
          type: string
          enum: [image, video, audio, document]
          example: "image"
        media:
          type: string
          description: URL or Base64 data string of the media
          example: "https://example.com/invoice.pdf"
        caption:
          type: string
          example: "فاتورة الطلب رقم #1089"
        fileName:
          type: string
          example: "invoice-1089.pdf"

    BulkCampaignDto:
      type: object
      required:
        - campaignName
        - items
      properties:
        campaignName:
          type: string
          example: "عروض رمضان 2026"
        delayRangeSec:
          type: array
          items:
            type: integer
          example: [3, 8]
        items:
          type: array
          items:
            type: object
            required:
              - number
              - text
            properties:
              number:
                type: string
                example: "966501112233"
              text:
                type: string
                example: "عزيزي العميل، استمتع بخصم 30% بكود RAMADAN"

paths:
  /health:
    get:
      summary: Comprehensive System & Integration Health
      description: Returns real-time health checks for PostgreSQL, Redis, Memory, and Active Instances.
      responses:
        '200':
          description: System is healthy
        '503':
          description: Degraded performance or service down

  /message/sendText/{instanceName}:
    post:
      summary: Send Text Message
      description: Dispatches a text message via specified WhatsApp instance.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: instanceName
          in: path
          required: true
          schema:
            type: string
          example: "MainCompany"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextMessageDto'
      responses:
        '201':
          description: Message queued/sent successfully
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /message/sendMedia/{instanceName}:
    post:
      summary: Send Media File
      description: Sends an image, document, video, or audio file via WhatsApp.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: instanceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMediaMessageDto'
      responses:
        '201':
          description: Media sent successfully

  /instance/connect/{instanceName}:
    get:
      summary: Generate QR Code / Pairing Code
      security:
        - ApiKeyAuth: []
      parameters:
        - name: instanceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QR code base64 or pairing code
